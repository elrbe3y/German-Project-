<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#02060d" />
<meta name="description" content="An interactive university presentation on cyber security: threats and defenses, careers, certifications and a learning roadmap." />
<title>Cyber Security | University Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:190}
*{box-sizing:border-box;margin:0;padding:0}
:root{--d:'Chakra Petch','Space Grotesk',system-ui,sans-serif;--m:'IBM Plex Mono',ui-monospace,Menlo,monospace;--c:#22d3ee;--t:#8da2b8;--ln:rgba(34,211,238,.18)}
html{background:#02060d;color-scheme:dark;scroll-snap-type:y mandatory;scroll-behavior:smooth}
body{--h:190;--ox:0;--oy:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#02060d;color:#e6f1ff;overflow-x:hidden;transition:--h 1.4s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sn{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start;scroll-snap-stop:always}
#net,#grid,#spot,.orb{position:fixed;pointer-events:none}
#net{inset:0;z-index:0}
#grid{inset:0;z-index:0;background-image:linear-gradient(rgba(34,211,238,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 75%);animation:gm 14s linear infinite}
@keyframes gm{to{background-position:0 56px}}
.orb{width:70vmax;height:70vmax;left:50%;top:50%;margin:-35vmax 0 0 -35vmax;border-radius:50%;filter:blur(60px);z-index:0;transition:transform 2s cubic-bezier(.16,1,.3,1)}
#o1{background:radial-gradient(circle,hsl(var(--h) 95% 55% / .28),transparent 62%);transform:translate(calc(var(--ox)*1vw),calc(var(--oy)*1vh))}
#o2{background:radial-gradient(circle,hsl(calc(var(--h) + 60) 90% 60% / .2),transparent 62%);transform:translate(calc(var(--ox)*-1vw),calc(var(--oy)*-1vh))}
#spot{inset:0;z-index:1;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),hsl(var(--h) 95% 55% / .1),transparent 60%)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,#22d3ee,#818cf8);box-shadow:0 0 12px #22d3ee}
#top{position:fixed;top:0;left:0;right:0;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 14px) 22px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(#02060d 30%,transparent)}
.logo{display:flex;align-items:center;gap:10px;font:700 15px var(--d);letter-spacing:.16em;color:#fff}
#links{display:none;gap:22px}
#links button,#menu button{position:relative;color:#9fb3c8;font-size:14px;transition:color .25s}
#links button::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--c);transform:scaleX(0);transition:transform .3s}
#links button:hover,#links button.on{color:var(--c)}#links button.on::after{transform:scaleX(1)}
#right{display:flex;align-items:center;gap:16px}
#burger{border:1px solid rgba(34,211,238,.3);border-radius:10px;width:44px;height:44px;font-size:18px}
@media(min-width:1024px){#links{display:flex}#burger{display:none}}
#menu{position:fixed;inset:0;z-index:49;background:rgba(2,6,13,.96);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;visibility:hidden;transition:.4s}
#menu.open{opacity:1;visibility:visible}
#menu button{font:700 28px var(--d);color:#fff}#menu button.on{color:var(--c)}
#dots{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:10px}
.dot{position:relative;width:8px;height:8px;border-radius:99px;background:rgba(159,179,200,.35);transition:.4s}
.dot::after{content:"";position:absolute;inset:-6px -10px}
.dot::before{content:attr(data-l);position:absolute;right:20px;top:50%;transform:translateY(-50%);padding:3px 10px;border-radius:8px;background:rgba(9,20,34,.92);border:1px solid var(--ln);font:500 12px var(--m);color:#e6f1ff;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.dot:hover::before{opacity:1}
.dot.on{height:26px;background:var(--c);box-shadow:0 0 14px var(--c)}
#kb{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:40;padding:6px 14px;border-radius:99px;border:1px solid var(--ln);background:rgba(9,20,34,.7);font:500 12px var(--m);color:var(--t);transition:opacity .6s}
#kb.hide{opacity:0}@media(hover:none){#kb{display:none}}
#deck{position:relative;z-index:10}
#stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:84px 28px 40px;opacity:0;visibility:hidden;transform:translateY(7%) scale(.97);transition:opacity .6s,transform 1s cubic-bezier(.16,1,.3,1),visibility 0s .6s}
.scene[data-s=past]{transform:translateY(-7%) scale(1.03)}
.scene[data-s=active]{opacity:1;visibility:visible;transform:none;transition:opacity .7s .1s,transform 1s .1s cubic-bezier(.16,1,.3,1),visibility 0s}
.wrap{position:relative;max-width:1100px;width:100%;text-align:center}
.pop{opacity:0;transform:translateY(46px) scale(.92);filter:blur(10px);transition:opacity .4s,transform .4s,filter .4s,border-color .3s,background-color .3s}
.scene[data-s=active] .pop{opacity:1;transform:none;filter:none;transition:opacity .9s,transform .9s cubic-bezier(.16,1,.3,1),filter .9s,border-color .3s,background-color .3s;transition-delay:calc(var(--i,0)*70ms + 150ms)}
.kicker{font:500 13px var(--m);color:var(--c);margin-bottom:14px}
.kicker::before{content:"";display:inline-block;width:22px;height:1px;background:currentColor;vertical-align:middle;margin-right:10px}
.title{font:700 clamp(30px,5.4vw,64px)/1.05 var(--d);background:linear-gradient(90deg,#e6f1ff,#22d3ee 60%,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
.sub{color:var(--t);font-size:clamp(14px,1.6vw,17px);max-width:660px;margin:0 auto 26px;line-height:1.55}
.big{font:700 clamp(34px,7vw,92px)/1.1 var(--d)}
.wd{display:inline-block;margin:0 .14em}
.g{background:linear-gradient(90deg,#22d3ee,#818cf8,#22d3ee);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200% 0}}
.hint{margin-top:34px;color:var(--c);font:500 13px var(--m)}
.hint span{display:inline-block;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.ring{position:absolute;left:50%;top:50%;border:1px dashed rgba(34,211,238,.25);border-radius:50%;transform:translate(-50%,-50%);animation:rot 30s linear infinite;pointer-events:none}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hero{font:700 clamp(40px,9.5vw,132px)/1 var(--d);letter-spacing:-.02em;margin-bottom:16px;filter:drop-shadow(0 0 30px rgba(34,211,238,.35))}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;text-align:left}
@media(min-width:768px){.grid{gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.g1{grid-template-columns:1fr}@media(min-width:768px){.g1{grid-template-columns:repeat(3,1fr)}}
.card{perspective:800px}
.in{position:relative;display:block;width:100%;height:100%;overflow:hidden;background:rgba(9,20,34,.62);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:16px;padding:16px;cursor:pointer;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));transition:transform .2s ease-out,border-color .3s,box-shadow .3s,background-color .3s,opacity .4s,filter .4s}
.in::after{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--gx,50%) var(--gy,0%),rgba(34,211,238,.16),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.in:hover,.in:focus-visible{border-color:rgba(34,211,238,.6);box-shadow:0 14px 44px rgba(34,211,238,.16)}
.in:hover::after{opacity:1}
.card.dim .in{--s:.95;opacity:.16;filter:grayscale(1);pointer-events:none}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(99,102,241,.2));margin-bottom:10px;box-shadow:0 0 24px rgba(34,211,238,.15);transition:.3s}
.card h3,.step h3{font:600 16px var(--d)}
.card p{color:var(--t);font-size:13px;line-height:1.5;max-height:0;opacity:0;overflow:hidden;transition:max-height .35s,opacity .3s,margin .3s}
.in.open p,.show p,.in .b p{max-height:140px;opacity:1;margin-top:6px}
@media(min-width:640px){.card p{max-height:none;opacity:1;margin-top:6px}}
.in.has::before{content:"+";position:absolute;top:8px;right:13px;font:500 18px var(--m);color:var(--c);display:none}
@media(max-width:639px){.in.has::before{display:block}.in.open::before{content:"\2013"}.show .in::before{display:none!important}}
.b{display:none}.in.flip .f{display:none}.in.flip .b{display:block;animation:fin .45s cubic-bezier(.16,1,.3,1)}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
.th .ico{color:#f87171;background:rgba(248,113,113,.14)}
.th .in.flip{border-color:rgba(74,222,128,.55);background:rgba(10,32,24,.66)}
.th .in.flip .ico{color:#4ade80;background:rgba(74,222,128,.14)}
.b h3{color:#4ade80}
.tap{display:block;margin-top:10px;font:500 12px var(--m);color:#f87171}
.team .in{text-align:center;cursor:default}.team .ico{margin:0 auto 10px}
.lnk{color:inherit;text-decoration:underline;text-decoration-color:rgba(34,211,238,.5);text-underline-offset:4px}
.role{display:block;color:var(--c);font-size:12px;margin-top:4px}
.badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:99px;margin-top:8px;border:1px solid}
.b1{color:#4ade80;border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.1)}
.b2{color:#facc15;border-color:rgba(250,204,21,.4);background:rgba(250,204,21,.1)}
.b3{color:#f87171;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-8px 0 18px}
.chip{min-height:40px;padding:0 18px;border-radius:99px;border:1px solid var(--ln);font:500 13px var(--d);color:var(--t);transition:.25s}
.chip:hover{color:#fff;border-color:rgba(34,211,238,.5)}
.chip.on{color:#02060d;background:var(--c);border-color:var(--c);box-shadow:0 0 22px rgba(34,211,238,.4)}
.steps{display:grid;gap:10px;max-width:760px;margin:0 auto;text-align:left}
.step{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:rgba(9,20,34,.62);border:1px solid var(--ln);cursor:pointer}
.step:hover{border-color:rgba(34,211,238,.55)}
.ck{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(34,211,238,.5);font:700 16px var(--d);color:var(--c);transition:.3s}
.step p{color:var(--t);font-size:13px;margin-top:2px}
.step.done{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.07)}
.step.done .ck{background:#4ade80;border-color:#4ade80;color:#02060d;font-size:0}
.step.done .ck::after{content:"\2713";font-size:18px}
.step.done h3{color:#a7f3c4}
.prog{height:6px;border-radius:9px;background:rgba(34,211,238,.12);max-width:760px;margin:18px auto 8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#4ade80);transition:width .5s cubic-bezier(.16,1,.3,1)}
.btn{display:inline-block;padding:14px 26px;margin:6px;border-radius:12px;font-weight:600;font-size:15px;color:#fff;text-decoration:none;background:linear-gradient(90deg,#0891b2,#4f46e5);transition:box-shadow .3s,transform .2s ease-out}
.btn:hover{box-shadow:0 0 36px rgba(34,211,238,.5)}
.btn.o{background:transparent;border:1px solid var(--c);color:var(--c)}
.note{color:#6b8199;font-size:12px;margin-top:16px}
#loader{position:fixed;inset:0;z-index:100;background:#02060d;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#loader.off{opacity:0;visibility:hidden}
#loader p{color:var(--c);font:500 13px var(--m)}
.lb{width:min(240px,60vw);height:3px;border-radius:9px;background:rgba(34,211,238,.15);overflow:hidden}
.lb i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="loader"><svg viewBox="0 0 100 100" width="56" height="56" style="filter:drop-shadow(0 0 8px rgba(0,200,255,.7))"><path d="M50 6 L90 24 V54 C90 76 72 90 50 96 C28 90 10 76 10 54 V24 Z" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linejoin="round"/><circle cx="50" cy="50" r="13" fill="none" stroke="#22d3ee" stroke-width="4"/><path d="M50 50V24M50 50H24M50 50V76M50 50H76" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="24" r="3" fill="#22d3ee"/><circle cx="76" cy="24" r="3" fill="#22d3ee"/><circle cx="24" cy="76" r="3" fill="#22d3ee"/><circle cx="76" cy="76" r="3" fill="#22d3ee"/></svg><p id="lt">Initializing secure channel</p><div class="lb"><i id="lp"></i></div></div>
<div id="bar"></div>
<canvas id="net" aria-hidden="true"></canvas>
<div id="grid"></div><div class="orb" id="o1"></div><div class="orb" id="o2"></div><div id="spot"></div>
<header id="top">
  <button class="logo" data-i="0" aria-label="Back to start">
    <svg viewBox="0 0 100 100" width="34" height="34" style="filter:drop-shadow(0 0 6px rgba(0,200,255,.7))"><path d="M50 6 L90 24 V54 C90 76 72 90 50 96 C28 90 10 76 10 54 V24 Z" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linejoin="round"/><circle cx="50" cy="50" r="13" fill="none" stroke="#22d3ee" stroke-width="4"/><path d="M50 50V24M50 50H24M50 50V76M50 50H76" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="24" r="3" fill="#22d3ee"/><circle cx="76" cy="24" r="3" fill="#22d3ee"/><circle cx="24" cy="76" r="3" fill="#22d3ee"/><circle cx="76" cy="76" r="3" fill="#22d3ee"/></svg>
    <span id="lg" data-t="CYBER SECURITY">CYBER SECURITY</span>
  </button>
  <nav id="links" aria-label="Sections"></nav>
  <div id="right">
    <div id="langsw" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="de" aria-pressed="false">DE</button></div>
    <button id="burger" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
</header>
<div id="menu"></div>
<div id="dots"></div>
<main id="deck"><div id="stage"></div></main>
<div id="kb">Scroll, or press ↑ ↓</div>
<div class="sr" id="sr" aria-live="polite"></div>
<noscript><p style="position:relative;z-index:20;padding:90px 28px;text-align:center">This presentation needs JavaScript to run.</p></noscript>

<script>
const I={
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
code:'<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>',
zap:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
file:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 14l2 2 4-4"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',
radar:'<path d="M4 12a8 8 0 018-8"/><path d="M8 12a4 4 0 014-4"/><circle cx="12" cy="12" r="1.5"/><path d="M12 12l7 7"/>',
cloud:'<path d="M7 18a4 4 0 010-8 5 5 0 019.5-1A4.5 4.5 0 0117 18z"/>',
alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
server:'<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>',
scroll:'<path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
flask:'<path d="M9 3h6M10 3v6l-5 10a1.5 1.5 0 001.4 2h11.2a1.5 1.5 0 001.4-2L14 9V3"/>',
palette:'<path d="M12 3a9 9 0 000 18c1.5 0 2-1 1.5-2s0-2 1.5-2h2a3 3 0 003-3c0-6-4-11-8-11z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/>',
cube:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
book:'<path d="M3 5h7a2 2 0 012 2v13a2 2 0 00-2-2H3zM21 5h-7a2 2 0 00-2 2v13a2 2 0 012-2h7z"/>',
pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
bug:'<rect x="8" y="8" width="8" height="11" rx="4"/><path d="M12 8V5M5 12h3M16 12h3M6 18l2-2M18 18l-2-2M6 6l2 2M18 6l-2 2"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 6M22 20c0-3-2-5-4-5.5"/>',
wave:'<path d="M3 12h3l2-6 4 12 3-9 2 3h4"/>',
db:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
award:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/>'};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let dn=[];try{dn=JSON.parse(localStorage.getItem('cs-done')||'[]')}catch(e){}
let LANG='en';try{LANG=localStorage.getItem('cs-lang')==='de'?'de':'en'}catch(e){}

const ic=(n,s=24)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const wd=(a,b=[])=>[...a.map(x=>[x,'']),...b.map(x=>[x,'g'])].map(([x,c],i)=>`<span class="pop wd ${c}" style="--i:${i}">${x}</span>`).join('');
const head=(k,t,s)=>`${k?`<p class="kicker pop" style="--i:0">${k}</p>`:''}<h2 class="title pop" style="--i:1">${t}</h2>${s?`<p class="sub pop" style="--i:2">${s}</p>`:''}`;

function scr(el){if(!el)return;cancelAnimationFrame(el._r);const t=el.dataset.t,t0=performance.now();(function f(n){const k=(n-t0)/70;el.textContent=[...t].map((c,i)=>c===' '||i<k-3?c:G[Math.random()*G.length|0]).join('');if(k<t.length+3)el._r=requestAnimationFrame(f);else el.textContent=t})(t0)}

function setScene(i){
  if(i===cur)return;cur=i;
  scenes.forEach((el,k)=>el.dataset.s=k===i?'active':k<i?'past':'next');
  $$('.dot').forEach((d,k)=>{d.classList.toggle('on',k===i);k===i?d.setAttribute('aria-current','true'):d.removeAttribute('aria-current')});
  $$('#links button,#menu button').forEach(a=>a.classList.toggle('on',+a.dataset.i===i));
  $('#sr').textContent=S[i].l+', '+(i+1)+' of '+N;
  const b=document.body.style;hue=190+i*9;b.setProperty('--h',hue);b.setProperty('--ox',Math.sin(i*1.3)*30);b.setProperty('--oy',Math.cos(i*1.1)*25);
  boost=6;
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}
  if(i===3&&!RM)setTimeout(()=>{scr($('#h1'));scr($('#h2'))},350);
}
let tick=false;
function onScroll(){
  const max=(N-1)*step,p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;

function setLang(lang){
  if(lang===LANG)return;
  LANG=lang;try{localStorage.setItem('cs-lang',LANG)}catch(e){}
  const saved=Math.max(0,cur);
  S=buildScenes(LANG);
  stage.innerHTML=S.map(s=>`<section class="scene"><div class="wrap">${s.h}</div></section>`).join('');
  scenes=[...stage.children];
  rebuildNav();paintChrome();upd();
  document.body.classList.add('no-anim');
  cur=-1;setScene(saved);
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove('no-anim')));
}

});

  if(b){const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.28}px)`}
});

});
const M={x:-999,y:-999};
addEventListener('pointermove',e=>{const r=document.documentElement.style;r.setProperty('--mx',e.clientX+'px');r.setProperty('--my',e.clientY+'px');M.x=e.clientX;M.y=e.clientY});

const cv=$('#net'),cx=cv.getContext('2d');let W,H,P=[];
function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);P=Array.from({length:Math.min(90,W*H/18000|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}
function frame(){
  hh+=(hue-hh)*.04;boost*=.95;cx.clearRect(0,0,W,H);
  const col=a=>`hsla(${hh},95%,62%,${a})`;
  for(const a of P){
    a.x+=a.vx*(1+boost);a.y+=a.vy*(1+boost)-boost*.6;
    if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0)a.y=H;if(a.y>H)a.y=0;
    const dx=M.x-a.x,dy=M.y-a.y,dm=dx*dx+dy*dy,near=dm<22500;
    cx.fillStyle=col(near?1:.7);cx.beginPath();cx.arc(a.x,a.y,near?2.5:1.6,0,6.3);cx.fill();
    if(near){cx.strokeStyle=col(.55*(1-dm/22500));cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(M.x,M.y);cx.stroke()}
  }
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=dx*dx+dy*dy;if(d<16900){cx.strokeStyle=col(.22*(1-d/16900));cx.beginPath();cx.moveTo(P[i].x,P[i].y);cx.lineTo(P[j].x,P[j].y);cx.stroke()}}
  if(!RM)requestAnimationFrame(frame);
}
addEventListener('resize',()=>{layout();size();onScroll()});
layout();size();frame();
const h0=parseInt(location.hash.slice(1));
if(h0>1&&h0<=N)goTo(h0-1,'instant');
onScroll();

const L=['Initializing secure channel','Verifying certificates','Access granted'];let lp=0,fin=false;
const li=setInterval(()=>{lp=Math.min(88,lp+8+Math.random()*10);$('#lp').style.width=lp+'%';$('#lt').textContent=L[lp>60?1:0]},140);
function ready(){if(fin)return;fin=true;clearInterval(li);$('#lp').style.width='100%';$('#lt').textContent=L[2];setTimeout(()=>$('#loader').classList.add('off'),500)}
addEventListener('load',ready);setTimeout(ready,4500);
</script>
